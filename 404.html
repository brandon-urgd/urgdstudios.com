<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1A1A1A;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .error-code {
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 900;
            background: linear-gradient(45deg, #FF0080, #0080FF, #00FF80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 0.8;
            margin-bottom: 1rem;
            opacity: 0.8;
            font-family: 'Rubik', sans-serif;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .error-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
            font-family: 'Rubik', sans-serif;
        }

        .error-message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 3rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 400;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .error-btn {
            padding: 1rem 2rem;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-family: 'Rubik', sans-serif;
            text-decoration: none;
            display: inline-block;
        }

        .error-btn.primary {
            background: linear-gradient(45deg, #00FF80, #0080FF);
            color: #ffffff;
        }

        .error-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 128, 0.4);
        }

        .error-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .error-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-element {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(0, 255, 128, 0.3);
            border-radius: 50%;
            animation: float 15s infinite linear;
            box-shadow: 0 0 10px rgba(0, 255, 128, 0.5);
        }

        .floating-element:nth-child(2n) {
            background: rgba(0, 128, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 128, 255, 0.5);
        }

        .floating-element:nth-child(3n) {
            background: rgba(255, 255, 0, 0.3);
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .error-actions {
                flex-direction: column;
                align-items: center;
            }

            .error-btn {
                width: 200px;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-element" style="left: 10%; animation-delay: 0s;"></div>
        <div class="floating-element" style="left: 20%; animation-delay: 2s;"></div>
        <div class="floating-element" style="left: 30%; animation-delay: 4s;"></div>
        <div class="floating-element" style="left: 40%; animation-delay: 6s;"></div>
        <div class="floating-element" style="left: 50%; animation-delay: 8s;"></div>
        <div class="floating-element" style="left: 60%; animation-delay: 10s;"></div>
        <div class="floating-element" style="left: 70%; animation-delay: 12s;"></div>
        <div class="floating-element" style="left: 80%; animation-delay: 14s;"></div>
        <div class="floating-element" style="left: 90%; animation-delay: 16s;"></div>
    </div>

    <div class="container">
        <div class="error-container">
            <div class="error-code">404</div>
            <div class="error-icon">🌌</div>
            <h1 class="error-title">Lost in Space</h1>
            <p class="error-message">Oops! The page you're looking for has drifted into the digital void. Let's get you back to familiar territory.</p>
            
            <div class="error-actions">
                <a href="index.html" class="error-btn primary">Take Me Home</a>
                <a href="mailto:brandon@urgdstudios.com" class="error-btn secondary">Contact Support</a>
            </div>
        </div>
    </div>
</body>
</html>
