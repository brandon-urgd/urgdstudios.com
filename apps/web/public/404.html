<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — ur/gd Studios</title>
  <meta name="robots" content="noindex">
  <style>
    /* Inline CSS — Self-contained error page */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.92);
      background-color: #0a0a14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    main {
      max-width: 720px;
      text-align: center;
    }

    .logo {
      margin-bottom: 3rem;
    }

    .logo svg {
      height: 40px;
      width: auto;
    }

    .error-code {
      font-size: 4rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.92);
      margin-bottom: 1.5rem;
      line-height: 1;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.0625rem;
      color: rgba(255, 255, 255, 0.64);
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.5rem 1.5rem;
      background: transparent;
      color: #818cf8;
      border: 1px solid #818cf8;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 120ms ease;
      min-height: 44px;
      min-width: 44px;
      line-height: 1.4;
    }

    .btn:hover {
      background: rgba(129, 140, 248, 0.10);
    }

    .btn:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }

    .support-text {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.50);
    }

    .support-text a {
      color: #818cf8;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .support-text a:hover {
      color: #a5b4fc;
    }

    @media (max-width: 640px) {
      .error-code {
        font-size: 3rem;
      }

      h1 {
        font-size: 1.25rem;
      }

      p {
        font-size: 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <svg width="120" height="32" viewBox="0 0 120 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ur/gd Studios">
        <text x="0" y="24" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="rgba(255,255,255,0.92)">ur/gd</text>
      </svg>
    </div>
    
    <div class="error-code">404</div>
    
    <h1>This page doesn't exist.</h1>
    
    <p>Whatever you were looking for isn't here — but the rest of the site is.</p>
    
    <a href="/" class="btn">Back to Home</a>
    
    <p class="support-text">If you think something's wrong, reach us at <a href="mailto:admin@urgdstudios.com">admin@urgdstudios.com</a>.</p>
  </main>
</body>
</html>
