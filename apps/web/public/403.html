<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restricted — ur/gd Studios</title>
  <meta name="robots" content="noindex">
  <style>
    @font-face {
      font-family: 'Archivo';
      src: url('/fonts/Archivo/Archivo-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Rubik';
      src: url('/fonts/Rubik/Rubik-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Rubik', system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.92);
      background-color: #0a0a14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      text-align: center;
      max-width: 520px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.75rem;
      padding: 3rem 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.20);
    }

    h1 {
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      font-weight: 700;
      line-height: 1.2;
      color: rgba(255, 255, 255, 0.92);
      margin-bottom: 1rem;
    }

    .message {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.64);
      margin-bottom: 2rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      padding: 0.75rem 1.5rem;
      min-height: 44px;
      color: #818cf8;
      font-size: 1rem;
      font-weight: 600;
      border: 1px solid #818cf8;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .back-link:hover {
      background-color: rgba(129, 140, 248, 0.10);
      color: #a5b4fc;
    }

    .back-link:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }

    .contact {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.50);
    }

    .contact a {
      color: #818cf8;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .contact a:hover {
      color: #a5b4fc;
    }

    @supports not (backdrop-filter: blur(16px)) {
      .card {
        background: rgba(255, 255, 255, 0.08);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (prefers-reduced-transparency: reduce) {
      .card {
        background: rgba(20, 20, 35, 0.95);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border-color: rgba(255, 255, 255, 0.15);
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Restricted</h1>
      <p class="message">You don't have access to this page.</p>
      <a href="/" class="back-link">Back to Home</a>
      <p class="contact">Need help? Email us at <a href="mailto:admin@urgdstudios.com">admin@urgdstudios.com</a></p>
    </div>
  </main>
</body>
</html>
