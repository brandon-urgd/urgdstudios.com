AWSTemplateFormatVersion: '2010-09-09'
Description: 'ur/gd urgdstudios.com - Corporate website static site infrastructure'

Metadata:
  urgd:
    version: '1.0.3'
    environment: 'prod'
    lastUpdated: '2026-06-10'
    owner: 'ur/gd Studios'
    securityLevel: 'high'

Parameters:
  Environment:
    Type: String
    Default: 'prod'
    AllowedValues:
      - prod
    Description: 'Environment name (single-environment deployment)'

  WafWebAclArn:
    Type: String
    Description: 'WAF WebACL ARN from SSM Parameter Store (/urgd/waf/web_acl_arn)'
    Default: ''

  ArtifactBucket:
    Type: String
    Default: 'urgd-applicationdata'
    Description: 'S3 bucket containing deployment artifacts'

  IntakeCodeKey:
    Type: String
    Description: 'S3 key for intake Lambda ZIP (versioned) - passed by CI/CD pipeline'
    Default: 'urgdstudios-com/artifacts/PLACEHOLDER/urgd-urgdstudios-com-intake-PLACEHOLDER.zip'

  CorsAllowedOrigins:
    Type: String
    Description: 'Comma-separated list of allowed CORS origins for API'
    Default: 'https://urgdstudios.com'

  AlertsEmail:
    Type: String
    Description: 'Email address for operational alerts'
    Default: 'alerts@urgd.dev'

  PowDifficulty:
    Type: Number
    Description: 'Proof-of-work difficulty (number of leading zeros required in hash)'
    Default: 4
    MinValue: 1
    MaxValue: 8

  AdminCodeKey:
    Type: String
    Description: 'S3 key for admin Lambda ZIP (versioned) - passed by CI/CD pipeline'
    Default: 'urgdstudios-com/artifacts/PLACEHOLDER/urgd-urgdstudios-com-admin-PLACEHOLDER.zip'

  BetaCodeKey:
    Type: String
    Description: 'S3 key for beta Lambda ZIP (versioned) - passed by CI/CD pipeline'
    Default: 'urgdstudios-com/artifacts/PLACEHOLDER/urgd-urgdstudios-com-beta-PLACEHOLDER.zip'

  CommandCenterReply:
    Type: String
    Description: 'Feature flag: enable admin reply-via-email (true/false)'
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  CommandCenterAutoResponse:
    Type: String
    Description: 'Feature flag: send auto-acknowledgment email to visitor on form submission (true/false)'
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

Resources:
  # ========================================
  # S3 Bucket (Import-ready)
  # ========================================
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: urgdstudios.com
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: 's3/site/'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios
        - Key: brand
          Value: urgd

  # ========================================
  # S3 Access Logs Bucket
  # ========================================
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    # checkov:skip=CKV_AWS_18:Access logs bucket does not log to itself (circular dependency)
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'urgd-urgdstudios-com-access-logs-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 90
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios
        - Key: Purpose
          Value: access-logs

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3ServerAccessLogging
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AccessLogsBucket.Arn}/s3/*'
            Condition:
              ArnLike:
                'aws:SourceArn':
                  - !GetAtt SiteBucket.Arn
                  - !GetAtt ColdStorageBucket.Arn
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
          - Sid: AllowCloudFrontLogging
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AccessLogsBucket.Arn}/cloudfront/*'
            Condition:
              StringEquals:
                'aws:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  # ========================================
  # S3 Cold Storage Bucket
  # ========================================
  ColdStorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'urgd-urgdstudios-com-coldstorage-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: 's3/coldstorage/'
      LifecycleConfiguration:
        Rules:
          - Id: TransitionAndExpire
            Status: Enabled
            ExpirationInDays: 90
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios
        - Key: Purpose
          Value: cold-storage

  # ========================================
  # Origin Access Control (OAC) - Import-ready
  # ========================================
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OriginAccessControlConfig:
        Name: 'oac-urgdstudios.com.s3.us-west-2.amazonaws.com-mentjrr0wy4'
        Description: 'Created by CloudFront'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ========================================
  # S3 Bucket Policy (OAC-based)
  # ========================================
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Id: PolicyForCloudFrontPrivateContent
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  # ========================================
  # CloudFront Function - Viewer Request Handler
  # Combines: www-to-root redirect + directory index rewrite
  # ========================================
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: urgdstudios-viewer-request
      FunctionConfig:
        Comment: 'Redirects www to root domain and rewrites directory paths to index.html'
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var host = request.headers.host.value;
            
            // Redirect www.urgdstudios.com -> urgdstudios.com
            if (host.startsWith('www.')) {
                return {
                    statusCode: 301,
                    statusDescription: 'Moved Permanently',
                    headers: {
                        location: { value: 'https://urgdstudios.com' + request.uri }
                    }
                };
            }
            
            var uri = request.uri;
            
            // Command Center SPA: rewrite all /command/* extensionless paths to the
            // root /index.html (the Vite SPA entry point). React Router handles
            // client-side routing from there. /command/index.html does not exist
            // in S3 — only the root index.html is the SPA shell.
            if (uri === '/command' || (uri.startsWith('/command/') && !uri.includes('.'))) {
                request.uri = '/index.html';
                return request;
            }
            
            // Static site: if URI ends with '/', append 'index.html'
            if (uri.endsWith('/')) {
                request.uri += 'index.html';
            }
            // Static site: if URI has no extension, append '/index.html'
            else if (!uri.includes('.')) {
                request.uri += '/index.html';
            }
            
            return request;
        }
      AutoPublish: true

  # ========================================
  # CloudFront Distribution (Import-ready)
  # ========================================
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DistributionConfig:
        Aliases:
          - urgdstudios.com
          - www.urgdstudios.com
        DefaultRootObject: index.html
        Origins:
          - Id: !Sub '${SiteBucket}.s3.us-west-2.amazonaws.com-menteyvako7'
            DomainName: !Sub '${SiteBucket}.s3.us-west-2.amazonaws.com'
            OriginPath: ''
            S3OriginConfig:
              OriginAccessIdentity: ''
            ConnectionAttempts: 3
            ConnectionTimeout: 10
            OriginShield:
              Enabled: false
            OriginAccessControlId: !Ref SiteOriginAccessControl
          - Id: !Sub 'intake-api-${Environment}'
            DomainName: !Sub '${IntakeApi}.execute-api.${AWS::Region}.amazonaws.com'
            OriginPath: !Sub '/${Environment}'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            ConnectionAttempts: 3
            ConnectionTimeout: 10
        DefaultCacheBehavior:
          TargetOriginId: !Sub '${SiteBucket}.s3.us-west-2.amazonaws.com-menteyvako7'
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - HEAD
            - GET
          CachedMethods:
            - HEAD
            - GET
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - FunctionARN: !GetAtt ViewerRequestFunction.FunctionARN
              EventType: viewer-request
        CacheBehaviors:
          - PathPattern: '/v1/*'
            TargetOriginId: !Sub 'intake-api-${Environment}'
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - HEAD
              - DELETE
              - POST
              - GET
              - OPTIONS
              - PUT
              - PATCH
            CachedMethods:
              - HEAD
              - GET
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /403.html
            ResponseCode: '403'
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponsePagePath: /404.html
            ResponseCode: '404'
            ErrorCachingMinTTL: 300
        Comment: 'Primary CloudFront distribution for urgdstudios.com (index.html + static assets) - with directory index rewrite'
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Logging:
          Bucket: !GetAtt AccessLogsBucket.DomainName
          IncludeCookies: false
          Prefix: 'cloudfront/'
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:198919428218:certificate/61b3ca01-c69c-4e97-ad75-8134b6145af5
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        WebACLId: !Ref WafWebAclArn

  # ========================================
  # Slice 3: Intake Backend Infrastructure
  # ========================================

  # KMS Key for Encryption
  IntakeKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: 'KMS key for urgdstudios.com intake backend encryption'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow CloudWatch Logs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:CreateGrant'
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
          - Sid: Allow Lambda
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
            Resource: '*'
          - Sid: Allow DynamoDB
            Effect: Allow
            Principal:
              Service: dynamodb.amazonaws.com
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:CreateGrant'
              - 'kms:DescribeKey'
            Resource: '*'
          - Sid: Allow SNS
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
            Resource: '*'
          - Sid: Allow SQS
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey*'
              - 'kms:CreateGrant'
              - 'kms:DescribeKey'
            Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  IntakeKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/urgd-urgdstudios-com-intake-${Environment}'
      TargetKeyId: !Ref IntakeKmsKey

  # DynamoDB Table - Submissions
  IntakeSubmissionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'urgd-urgdstudios-com-submissions-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
        - AttributeName: ipHash
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ipHash-timestamp-index
          KeySchema:
            - AttributeName: ipHash
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref IntakeKmsKey
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # API Gateway HTTP API
  IntakeApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'urgd-urgdstudios-com-intake-${Environment}'
      Description: 'Intake API for urgdstudios.com contact form'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsAllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
        MaxAge: 86400
      Tags:
        Environment: !Ref Environment
        Application: urgdstudios-com
        Owner: ur/gd Studios

  # API Gateway Access Log Group
  IntakeApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/urgd-urgdstudios-com-intake-${Environment}'
      RetentionInDays: 30
      KmsKeyId: !GetAtt IntakeKmsKey.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # API Gateway Stage
  IntakeApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - IntakeHealthRoute
      - IntakeSubmitRoute
      - IntakeOptionsRoute
      - IntakeReportRoute
      - IntakeIntegration
      - BetaSignupRoute
      - BetaSurveyRoute
      - BetaLookupRoute
      - BetaHealthRoute
      - BetaOptionsSignupRoute
      - BetaOptionsSurveyRoute
      - BetaOptionsLookupRoute
      - BetaIntegration
      - AdminListRoute
      - AdminGetRoute
      - AdminUpdateRoute
      - AdminDeleteRoute
      - AdminReplyRoute
      - AdminHealthRoute
      - AdminBetaListRoute
      - AdminBetaUpdateRoute
      - AdminIntegration
    Properties:
      ApiId: !Ref IntakeApi
      StageName: !Ref Environment
      Description: !Sub 'API Gateway stage for ${Environment} environment'
      AutoDeploy: false  # CI/CD handles deployments explicitly
      AccessLogSettings:
        DestinationArn: !GetAtt IntakeApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage","errorMessage":"$context.error.message"}'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      Tags:
        Environment: !Ref Environment
        Application: urgdstudios-com
        Owner: ur/gd Studios

  # Lambda IAM Role
  IntakeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'urgd-urgdstudios-com-intake-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IntakePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:DescribeTable  # Health check
                Resource:
                  - !GetAtt IntakeSubmissionsTable.Arn
                  - !Sub '${IntakeSubmissionsTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !GetAtt IntakeDLQ.Arn
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/urgdstudios.com'
              - Effect: Allow
                Action:
                  - ses:GetSendQuota
                Resource: '*'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - !GetAtt IntakeKmsKey.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/urgd/command/api_key'
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Dead Letter Queue for Lambda
  IntakeDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub 'urgd-urgdstudios-com-intake-dlq-${Environment}'
      MessageRetentionPeriod: 1209600  # 14 days
      KmsMasterKeyId: !Ref IntakeKmsKey
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  AdminDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub 'urgd-urgdstudios-com-admin-dlq-${Environment}'
      MessageRetentionPeriod: 1209600  # 14 days
      KmsMasterKeyId: !Ref IntakeKmsKey
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Lambda Function
  IntakeFunction:
    Type: AWS::Lambda::Function
    # checkov:skip=CKV_AWS_117:Lambda VPC not required for this use case - no private resources accessed
    Properties:
      FunctionName: !Sub 'urgd-urgdstudios-com-intake-${Environment}'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt IntakeLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref IntakeCodeKey
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt IntakeDLQ.Arn
      KmsKeyArn: !GetAtt IntakeKmsKey.Arn
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          SUBMISSIONS_TABLE: !Ref IntakeSubmissionsTable
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          CORS_ALLOWED_METHODS: 'GET,POST,OPTIONS'
          CORS_ALLOWED_HEADERS: 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'
          ENVIRONMENT: !Ref Environment
          VERSION: '1.0.3'
          POW_DIFFICULTY: !Ref PowDifficulty
          COMMAND_CENTER_AUTO_RESPONSE: !Ref CommandCenterAutoResponse
          IP_HASH_SALT: !Sub 'urgd-${AWS::AccountId}-${Environment}'
          SES_FROM_ADDRESS: 'command@urgdstudios.com'
          SES_FROM_DISPLAY_NAME: 'ur/gd Command'
          SES_REPLY_TO: 'admin@urgdstudios.com'
          NOTIFICATION_TO_ADDRESS: 'admin@urgdstudios.com'
          SITE_URL: 'https://urgdstudios.com'
          COMMAND_API_KEY: '{{resolve:ssm:/urgd/command/api_key}}'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Lambda Permissions for API Gateway
  IntakeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IntakeFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${IntakeApi}/*'

  # API Gateway Routes
  IntakeHealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'GET /v1/intake/health'
      Target: !Sub 'integrations/${IntakeIntegration}'

  IntakeSubmitRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'POST /v1/intake'
      Target: !Sub 'integrations/${IntakeIntegration}'

  IntakeOptionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'OPTIONS /v1/intake'
      Target: !Sub 'integrations/${IntakeIntegration}'

  # App-to-app reporting route (no JWT auth — uses X-Api-Key header)
  IntakeReportRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'POST /v1/intake/report'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${IntakeIntegration}'

  # API Gateway Integration
  IntakeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref IntakeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IntakeFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  # ========================================
  # Beta Signup Backend Infrastructure
  # ========================================

  # DynamoDB Table - Beta Signups
  BetaSignupsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'urgd-urgdstudios-com-beta-signups-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: signupId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: app
          AttributeType: S
        - AttributeName: ipHash
          AttributeType: S
        - AttributeName: signupTimestamp
          AttributeType: S
      KeySchema:
        - AttributeName: signupId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-app-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
            - AttributeName: app
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ipHash-timestamp-index
          KeySchema:
            - AttributeName: ipHash
              KeyType: HASH
            - AttributeName: signupTimestamp
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref IntakeKmsKey
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Dead Letter Queue for Beta Lambda
  BetaDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub 'urgd-urgdstudios-com-beta-dlq-${Environment}'
      MessageRetentionPeriod: 1209600  # 14 days
      KmsMasterKeyId: !Ref IntakeKmsKey
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Beta Lambda IAM Role
  BetaFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'urgd-urgdstudios-com-beta-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BetaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # DynamoDB — Beta Table only, specific actions only
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt BetaSignupsTable.Arn
                  - !Sub '${BetaSignupsTable.Arn}/index/*'
              # DynamoDB — DescribeTable for health check only
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt BetaSignupsTable.Arn
              # SES — Send notification emails only, scoped to urgdstudios.com identity
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/urgdstudios.com'
              # SES — GetSendQuota for health check
              - Effect: Allow
                Action:
                  - ses:GetSendQuota
                Resource: '*'
              # SQS — DLQ send only
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !GetAtt BetaDLQ.Arn
              # KMS — Decrypt and generate data keys for table encryption
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - !GetAtt IntakeKmsKey.Arn
              # CloudWatch Logs — scoped to this Lambda's log group only
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/urgd-urgdstudios-com-beta-${Environment}:*'
              # X-Ray tracing
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Beta Lambda Log Group
  BetaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/urgd-urgdstudios-com-beta-${Environment}'
      RetentionInDays: 30
      KmsKeyId: !GetAtt IntakeKmsKey.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Beta Lambda Function
  BetaFunction:
    Type: AWS::Lambda::Function
    # checkov:skip=CKV_AWS_117:Lambda VPC not required - no private resources accessed
    DependsOn:
      - BetaFunctionLogGroup
    Properties:
      FunctionName: !Sub 'urgd-urgdstudios-com-beta-${Environment}'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt BetaFunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref BetaCodeKey
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt BetaDLQ.Arn
      KmsKeyArn: !GetAtt IntakeKmsKey.Arn
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          TABLE_NAME: !Ref BetaSignupsTable
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          ADMIN_EMAIL: 'admin@urgdstudios.com'
          ENVIRONMENT: !Ref Environment
          KMS_KEY_ID: !Ref IntakeKmsKey
          IP_HASH_SALT: !Sub 'urgd-${AWS::AccountId}-${Environment}'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Lambda invoke permission for API Gateway → Beta Lambda
  BetaFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BetaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${IntakeApi}/*'

  # API Gateway Integration for Beta Lambda
  BetaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref IntakeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BetaFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  # Beta API Routes — public (no auth)
  BetaSignupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'POST /v1/beta/signup'
      Target: !Sub 'integrations/${BetaIntegration}'

  BetaSurveyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'POST /v1/beta/survey'
      Target: !Sub 'integrations/${BetaIntegration}'

  BetaLookupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'GET /v1/beta/lookup'
      Target: !Sub 'integrations/${BetaIntegration}'

  BetaHealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'GET /v1/beta/health'
      Target: !Sub 'integrations/${BetaIntegration}'

  BetaOptionsSignupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'OPTIONS /v1/beta/signup'
      Target: !Sub 'integrations/${BetaIntegration}'

  BetaOptionsSurveyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'OPTIONS /v1/beta/survey'
      Target: !Sub 'integrations/${BetaIntegration}'

  BetaOptionsLookupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'OPTIONS /v1/beta/lookup'
      Target: !Sub 'integrations/${BetaIntegration}'

  # Admin Beta Routes — authenticated (JWT required)
  AdminBetaListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'GET /v1/admin/beta/signups'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub 'integrations/${AdminIntegration}'

  AdminBetaUpdateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'PATCH /v1/admin/beta/signups/{id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub 'integrations/${AdminIntegration}'

  # ========================================
  # Slice 4: Command Center — Auth, IAM, Log Group
  # ========================================

  # Cognito User Pool - Command Center admin authentication
  CommandCenterUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub 'urgd-urgdstudios-com-commandcenter-users-${Environment}'
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: 'OFF'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          Required: true
          Mutable: false
      UserPoolTags:
        Environment: !Ref Environment
        Application: urgdstudios-com
        Owner: ur/gd Studios

  # Cognito App Client - Command Center web client (SRP auth, no hosted UI)
  CommandCenterUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CommandCenterUserPool
      ClientName: !Sub 'urgd-urgdstudios-com-commandcenter-web-${Environment}'
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      RefreshTokenValidity: 7
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: minutes
        IdToken: minutes
      ReadAttributes:
        - email

  # Admin Lambda IAM Role - least-privilege per ARCHITECTURE.md §4
  AdminFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'urgd-urgdstudios-com-admin-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AdminPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt IntakeSubmissionsTable.Arn
              # Beta Table — Scan (list all signups) and UpdateItem (toggle sessionsSent)
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt BetaSignupsTable.Arn
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/urgdstudios.com'
              - Effect: Allow
                Action:
                  - ses:GetSendQuota
                Resource: '*'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !GetAtt AdminDLQ.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - !GetAtt IntakeKmsKey.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/urgd-urgdstudios-com-admin-${Environment}:*'
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Admin Lambda Log Group
  AdminFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/urgd-urgdstudios-com-admin-${Environment}'
      RetentionInDays: 30
      KmsKeyId: !GetAtt IntakeKmsKey.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Admin Lambda Function (Batch 2 — requires admin ZIP in S3 before deploying)
  AdminFunction:
    Type: AWS::Lambda::Function
    # checkov:skip=CKV_AWS_117:Lambda VPC not required - no private resources accessed directly
    DependsOn:
      - AdminFunctionLogGroup
    Properties:
      FunctionName: !Sub 'urgd-urgdstudios-com-admin-${Environment}'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt AdminFunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref AdminCodeKey
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 10
      DeadLetterConfig:
        TargetArn: !GetAtt AdminDLQ.Arn
      KmsKeyArn: !GetAtt IntakeKmsKey.Arn
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          SUBMISSIONS_TABLE: !Ref IntakeSubmissionsTable
          BETA_TABLE: !Ref BetaSignupsTable
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          CORS_ALLOWED_METHODS: 'GET,POST,PATCH,DELETE,OPTIONS'
          CORS_ALLOWED_HEADERS: 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'
          ENVIRONMENT: !Ref Environment
          VERSION: '1.0.3'
          COMMAND_CENTER_REPLY: !Ref CommandCenterReply
          SES_FROM_ADDRESS: 'command@urgdstudios.com'
          SES_FROM_DISPLAY_NAME: 'ur/gd Command'
          SES_REPLY_TO: 'admin@urgdstudios.com'
          SITE_URL: 'https://urgdstudios.com'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # API Gateway JWT Authorizer (Cognito native — no Lambda authorizer Lambda needed)
  CognitoJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref IntakeApi
      AuthorizerType: JWT
      Name: !Sub 'urgd-urgdstudios-com-cognito-${Environment}'
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref CommandCenterUserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CommandCenterUserPool}'

  # API Gateway Integration for Admin Lambda
  AdminIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref IntakeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  # Lambda invoke permission for API Gateway → Admin Lambda
  AdminFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${IntakeApi}/*'

  # Admin API Routes — authenticated (JWT required)
  AdminListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'GET /v1/admin/messages'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub 'integrations/${AdminIntegration}'

  AdminGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'GET /v1/admin/messages/{id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub 'integrations/${AdminIntegration}'

  AdminUpdateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'PATCH /v1/admin/messages/{id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub 'integrations/${AdminIntegration}'

  AdminDeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'DELETE /v1/admin/messages/{id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub 'integrations/${AdminIntegration}'

  AdminReplyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'POST /v1/admin/messages/{id}/reply'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub 'integrations/${AdminIntegration}'

  # Admin health check — no auth (public for monitoring)
  AdminHealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'GET /v1/admin/health'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${AdminIntegration}'

  # CloudWatch Log Group
  IntakeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/urgd-urgdstudios-com-intake-${Environment}'
      RetentionInDays: 30
      KmsKeyId: !GetAtt IntakeKmsKey.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # SNS Topic - Alerts
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'urgd-urgdstudios-com-cloudwatch-alerts-${Environment}'
      DisplayName: 'urgdstudios.com CloudWatch Alerts'
      KmsMasterKeyId: !Ref IntakeKmsKey
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com

  # SNS Subscription - Alerts Email
  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertsEmail

  # CloudWatch Alarms
  IntakeLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'urgd-urgdstudios-com-intake-errors-${Environment}'
      AlarmDescription: 'Intake Lambda error rate exceeded 10%'
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref IntakeFunction
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  IntakeLambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'urgd-urgdstudios-com-intake-throttles-${Environment}'
      AlarmDescription: 'Intake Lambda throttle detected'
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref IntakeFunction
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  IntakeLambdaLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'urgd-urgdstudios-com-intake-latency-${Environment}'
      AlarmDescription: 'Intake Lambda p99 latency exceeded 3s'
      MetricName: Duration
      Namespace: AWS/Lambda
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref IntakeFunction
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  IntakeDynamoDBThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'urgd-urgdstudios-com-intake-dynamodb-throttles-${Environment}'
      AlarmDescription: 'DynamoDB throttle detected on submissions table'
      MetricName: WriteThrottleEvents
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref IntakeSubmissionsTable
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  # Admin Lambda Alarms (Batch 2 — Slice 4 Command Center)
  AdminLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'urgd-urgdstudios-com-admin-errors-${Environment}'
      AlarmDescription: 'Admin Lambda error rate exceeded threshold (P0)'
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AdminFunction
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  AdminLambdaLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'urgd-urgdstudios-com-admin-latency-${Environment}'
      AlarmDescription: 'Admin Lambda p99 latency exceeded 3s (P1)'
      MetricName: Duration
      Namespace: AWS/Lambda
      ExtendedStatistic: p99
      Period: 900
      EvaluationPeriods: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AdminFunction
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  AdminLambdaVolumeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'urgd-urgdstudios-com-admin-volume-${Environment}'
      AlarmDescription: 'Admin Lambda invocation count anomaly — possible unauthorized access or runaway script (P1)'
      MetricName: Invocations
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AdminFunction
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  # CloudWatch Dashboard
  IntakeDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'urgd-urgdstudios-com-intake-${Environment}'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${IntakeFunction}", {"stat": "Sum", "label": "Invocations"}],
                  [".", "Errors", ".", ".", {"stat": "Sum", "label": "Errors"}],
                  [".", "Throttles", ".", ".", {"stat": "Sum", "label": "Throttles"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Intake Lambda Metrics",
                "period": 300
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${IntakeFunction}", {"stat": "Average", "label": "p50"}],
                  ["...", {"stat": "p99", "label": "p99"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Intake Lambda Duration",
                "period": 300
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${AdminFunction}", {"stat": "Sum", "label": "Invocations"}],
                  [".", "Errors", ".", ".", {"stat": "Sum", "label": "Errors"}],
                  [".", "Throttles", ".", ".", {"stat": "Sum", "label": "Throttles"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Admin Lambda Metrics",
                "period": 300
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${AdminFunction}", {"stat": "Average", "label": "p50"}],
                  ["...", {"stat": "p99", "label": "p99"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Admin Lambda Duration",
                "period": 300
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/Cognito", "SignInSuccesses", "UserPool", "${CommandCenterUserPool}", "UserPoolClient", "${CommandCenterUserPoolClient}", {"stat": "Sum", "label": "Sign-In Successes"}],
                  [".", "SignInThrottles", ".", ".", ".", ".", {"stat": "Sum", "label": "Sign-In Throttles"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Cognito Authentication",
                "period": 300
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/SES", "Send", {"stat": "Sum", "label": "Send"}],
                  [".", "Bounce", {"stat": "Sum", "label": "Bounce"}],
                  [".", "Complaint", {"stat": "Sum", "label": "Complaint"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "SES Email Delivery",
                "period": 300
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${IntakeSubmissionsTable}", {"stat": "Sum"}],
                  [".", "ConsumedWriteCapacityUnits", ".", ".", {"stat": "Sum"}],
                  [".", "WriteThrottleEvents", ".", ".", {"stat": "Sum"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "DynamoDB Consumption",
                "period": 300
              }
            }
          ]
        }

# ========================================
# Outputs (CI/CD contract)
# ========================================
Outputs:
  CloudFrontDistributionId:
    Description: 'CloudFront distribution ID (used by CI/CD for cache invalidation and WAF association)'
    Value: !Ref SiteDistribution
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDistributionId'

  S3BucketName:
    Description: 'S3 bucket name (used by CI/CD for S3 sync)'
    Value: !Ref SiteBucket
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketName'

  CloudFrontDistributionURL:
    Description: 'CloudFront domain name'
    Value: !GetAtt SiteDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDistributionURL'

  # Slice 3 Outputs
  ApiBaseUrl:
    Description: 'API Gateway base URL (used by CI/CD for smoke tests)'
    Value: !Sub 'https://${IntakeApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiBaseUrl'

  IntakeApiId:
    Description: 'API Gateway ID'
    Value: !Ref IntakeApi
    Export:
      Name: !Sub '${AWS::StackName}-IntakeApiId'

  UserPoolId:
    Description: 'Cognito User Pool ID (Command Center admin auth — used by CI/CD for frontend env vars)'
    Value: !Ref CommandCenterUserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  UserPoolClientId:
    Description: 'Cognito App Client ID (Command Center web client)'
    Value: !Ref CommandCenterUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'
