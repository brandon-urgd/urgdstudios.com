AWSTemplateFormatVersion: '2010-09-09'
Description: 'ur/gd urgdstudios.com - Corporate website static site infrastructure'

Metadata:
  urgd:
    version: '1.0.0'
    environment: 'prod'
    lastUpdated: '2026-02-15'
    owner: 'ur/gd Studios'
    securityLevel: 'high'

Parameters:
  Environment:
    Type: String
    Default: 'prod'
    AllowedValues:
      - prod
    Description: 'Environment name (single-environment deployment)'

  WafWebAclArn:
    Type: String
    Description: 'WAF WebACL ARN from SSM Parameter Store (/urgd/waf/web_acl_arn)'
    Default: ''

  ArtifactBucket:
    Type: String
    Default: 'urgd-applicationdata'
    Description: 'S3 bucket containing deployment artifacts'

  IntakeCodeKey:
    Type: String
    Description: 'S3 key for intake Lambda ZIP (versioned) - used in Slice 3'
    Default: 'urgdstudios-com/artifacts/placeholder/urgd-urgdstudios-com-intake-placeholder.zip'

  CorsAllowedOrigins:
    Type: String
    Description: 'Comma-separated list of allowed CORS origins for API'
    Default: 'https://urgdstudios.com'

  AlertsEmail:
    Type: String
    Description: 'Email address for operational alerts'
    Default: 'alerts@urgd.dev'

  # Slice 3 intake notification emails
  GeneralContactEmail:
    Type: String
    Description: 'Email for general contact inquiries'
    Default: 'brandon@urgdstudios.com'

  BugReportEmail:
    Type: String
    Description: 'Email for bug reports'
    Default: 'brandon@urgdstudios.com'

  FeatureRequestEmail:
    Type: String
    Description: 'Email for feature requests'
    Default: 'brandon@urgdstudios.com'

  PrivacyQuestionEmail:
    Type: String
    Description: 'Email for privacy questions'
    Default: 'privacy@urgdstudios.com'

  ReportAbuseEmail:
    Type: String
    Description: 'Email for abuse reports'
    Default: 'abuse@urgdstudios.com'

Resources:
  # ========================================
  # S3 Bucket (Import-ready)
  # ========================================
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: urgdstudios.com
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios
        - Key: brand
          Value: urgd

  # ========================================
  # Origin Access Control (OAC) - Import-ready
  # ========================================
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OriginAccessControlConfig:
        Name: 'oac-urgdstudios.com.s3.us-west-2.amazonaws.com-mentjrr0wy4'
        Description: 'Created by CloudFront'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ========================================
  # S3 Bucket Policy (OAC-based)
  # ========================================
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Id: PolicyForCloudFrontPrivateContent
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  # ========================================
  # CloudFront Function - Viewer Request Handler
  # Combines: www-to-root redirect + directory index rewrite
  # ========================================
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: urgdstudios-viewer-request
      FunctionConfig:
        Comment: 'Redirects www to root domain and rewrites directory paths to index.html'
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var host = request.headers.host.value;
            
            // Redirect www.urgdstudios.com -> urgdstudios.com
            if (host.startsWith('www.')) {
                return {
                    statusCode: 301,
                    statusDescription: 'Moved Permanently',
                    headers: {
                        location: { value: 'https://urgdstudios.com' + request.uri }
                    }
                };
            }
            
            var uri = request.uri;
            
            // If URI ends with '/', append 'index.html'
            if (uri.endsWith('/')) {
                request.uri += 'index.html';
            }
            // If URI doesn't have an extension, append '/index.html'
            else if (!uri.includes('.')) {
                request.uri += '/index.html';
            }
            
            return request;
        }
      AutoPublish: true

  # ========================================
  # CloudFront Distribution (Import-ready)
  # ========================================
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DistributionConfig:
        Aliases:
          - urgdstudios.com
          - www.urgdstudios.com
        DefaultRootObject: index.html
        Origins:
          - Id: !Sub '${SiteBucket}.s3.us-west-2.amazonaws.com-menteyvako7'
            DomainName: !Sub '${SiteBucket}.s3.us-west-2.amazonaws.com'
            OriginPath: ''
            S3OriginConfig:
              OriginAccessIdentity: ''
            ConnectionAttempts: 3
            ConnectionTimeout: 10
            OriginShield:
              Enabled: false
            OriginAccessControlId: !Ref SiteOriginAccessControl
          - Id: !Sub 'intake-api-${Environment}'
            DomainName: !Sub '${IntakeApi}.execute-api.${AWS::Region}.amazonaws.com'
            OriginPath: !Sub '/${Environment}'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            ConnectionAttempts: 3
            ConnectionTimeout: 10
        DefaultCacheBehavior:
          TargetOriginId: !Sub '${SiteBucket}.s3.us-west-2.amazonaws.com-menteyvako7'
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - HEAD
            - GET
          CachedMethods:
            - HEAD
            - GET
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - FunctionARN: !GetAtt ViewerRequestFunction.FunctionARN
              EventType: viewer-request
        CacheBehaviors:
          - PathPattern: '/v1/*'
            TargetOriginId: !Sub 'intake-api-${Environment}'
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - HEAD
              - DELETE
              - POST
              - GET
              - OPTIONS
              - PUT
              - PATCH
            CachedMethods:
              - HEAD
              - GET
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /403.html
            ResponseCode: '200'
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponsePagePath: /404.html
            ResponseCode: '200'
            ErrorCachingMinTTL: 300
        Comment: 'Primary CloudFront distribution for urgdstudios.com (index.html + static assets) - with directory index rewrite'
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:198919428218:certificate/61b3ca01-c69c-4e97-ad75-8134b6145af5
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        WebACLId: !Ref WafWebAclArn

  # ========================================
  # Slice 3: Intake Backend Infrastructure
  # ========================================

  # KMS Key for Encryption
  IntakeKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: 'KMS key for urgdstudios.com intake backend encryption'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow CloudWatch Logs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:CreateGrant'
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
          - Sid: Allow Lambda
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
            Resource: '*'
          - Sid: Allow DynamoDB
            Effect: Allow
            Principal:
              Service: dynamodb.amazonaws.com
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:CreateGrant'
              - 'kms:DescribeKey'
            Resource: '*'
          - Sid: Allow SNS
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
            Resource: '*'
          - Sid: Allow SQS
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey*'
              - 'kms:CreateGrant'
              - 'kms:DescribeKey'
            Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  IntakeKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/urgd-urgdstudios-com-intake-${Environment}'
      TargetKeyId: !Ref IntakeKmsKey

  # DynamoDB Table - Submissions
  IntakeSubmissionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'urgd-urgdstudios-com-submissions-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
        - AttributeName: ipHash
          AttributeType: S
        - AttributeName: submittedAt
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ipHash-submittedAt-index
          KeySchema:
            - AttributeName: ipHash
              KeyType: HASH
            - AttributeName: submittedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref IntakeKmsKey
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # API Gateway HTTP API
  IntakeApi:
    Type: AWS::ApiGatewayV2::Api
    # checkov:skip=CKV_AWS_95:Access logging not required for V1 static site contact form
    Properties:
      Name: !Sub 'urgd-urgdstudios-com-intake-${Environment}'
      Description: 'Intake API for urgdstudios.com contact form'
      ProtocolType: HTTP
      Tags:
        Environment: !Ref Environment
        Application: urgdstudios-com
        Owner: ur/gd Studios

  # API Gateway Stage
  IntakeApiStage:
    Type: AWS::ApiGatewayV2::Stage
    # checkov:skip=CKV_AWS_95:Access logging not required for V1 static site contact form
    Properties:
      ApiId: !Ref IntakeApi
      StageName: !Ref Environment
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      Tags:
        Environment: !Ref Environment
        Application: urgdstudios-com
        Owner: ur/gd Studios

  # Lambda IAM Role
  IntakeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'urgd-urgdstudios-com-intake-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IntakePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt IntakeSubmissionsTable.Arn
                  - !Sub '${IntakeSubmissionsTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref IntakeTopic
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !GetAtt IntakeDLQ.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - !GetAtt IntakeKmsKey.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Dead Letter Queue for Lambda
  IntakeDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub 'urgd-urgdstudios-com-intake-dlq-${Environment}'
      MessageRetentionPeriod: 1209600  # 14 days
      KmsMasterKeyId: !Ref IntakeKmsKey
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Lambda Function
  IntakeFunction:
    Type: AWS::Lambda::Function
    # checkov:skip=CKV_AWS_117:Lambda VPC not required for this use case - no private resources accessed
    Properties:
      FunctionName: !Sub 'urgd-urgdstudios-com-intake-${Environment}'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt IntakeLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref IntakeCodeKey
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt IntakeDLQ.Arn
      KmsKeyArn: !GetAtt IntakeKmsKey.Arn
      Environment:
        Variables:
          SUBMISSIONS_TABLE: !Ref IntakeSubmissionsTable
          INTAKE_TOPIC_ARN: !Ref IntakeTopic
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          CORS_ALLOWED_METHODS: 'GET,POST,OPTIONS'
          CORS_ALLOWED_HEADERS: 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'
          ENVIRONMENT: !Ref Environment
          VERSION: '1.0.0'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # Lambda Permissions for API Gateway
  IntakeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IntakeFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${IntakeApi}/*'

  # API Gateway Routes
  IntakeHealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'GET /v1/intake/health'
      Target: !Sub 'integrations/${IntakeIntegration}'

  IntakeSubmitRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'POST /v1/intake'
      Target: !Sub 'integrations/${IntakeIntegration}'

  IntakeOptionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: 'OPTIONS /v1/intake'
      Target: !Sub 'integrations/${IntakeIntegration}'

  # API Gateway Integration
  IntakeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref IntakeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IntakeFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  # SNS Topic - Intake Notifications
  IntakeTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'urgd-urgdstudios-com-contact-intake-${Environment}'
      DisplayName: 'urgdstudios.com Contact Intake'
      KmsMasterKeyId: !Ref IntakeKmsKey
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com

  # SNS Subscriptions with Filter Policies
  # TEMPORARILY COMMENTED OUT - Orphaned pending subscriptions blocking creation
  # Will re-enable after 3-day auto-expiration period
  # See: Slice 3 deployment - pending subscription conflict resolution
  
  # GeneralContactSubscription:
  #   Type: AWS::SNS::Subscription
  #   Properties:
  #     TopicArn: !Ref IntakeTopic
  #     Protocol: email
  #     Endpoint: !Ref GeneralContactEmail
  #     FilterPolicy:
  #       type:
  #         - general-contact
  #         - other

  # BugReportSubscription:
  #   Type: AWS::SNS::Subscription
  #   Properties:
  #     TopicArn: !Ref IntakeTopic
  #     Protocol: email
  #     Endpoint: !Ref BugReportEmail
  #     FilterPolicy:
  #       type:
  #         - bug-report

  # FeatureRequestSubscription:
  #   Type: AWS::SNS::Subscription
  #   Properties:
  #     TopicArn: !Ref IntakeTopic
  #     Protocol: email
  #     Endpoint: !Ref FeatureRequestEmail
  #     FilterPolicy:
  #       type:
  #         - feature-request

  # PrivacyQuestionSubscription:
  #   Type: AWS::SNS::Subscription
  #   Properties:
  #     TopicArn: !Ref IntakeTopic
  #     Protocol: email
  #     Endpoint: !Ref PrivacyQuestionEmail
  #     FilterPolicy:
  #       type:
  #         - privacy-question

  # ReportAbuseSubscription:
  #   Type: AWS::SNS::Subscription
  #   Properties:
  #     TopicArn: !Ref IntakeTopic
  #     Protocol: email
  #     Endpoint: !Ref ReportAbuseEmail
  #     FilterPolicy:
  #       type:
  #         - report-abuse

  # CloudWatch Log Group
  IntakeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/urgd-urgdstudios-com-intake-${Environment}'
      RetentionInDays: 90
      KmsKeyId: !GetAtt IntakeKmsKey.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com
        - Key: Owner
          Value: ur/gd Studios

  # SNS Topic - Alerts
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'urgd-urgdstudios-com-cloudwatch-alerts-${Environment}'
      DisplayName: 'urgdstudios.com CloudWatch Alerts'
      KmsMasterKeyId: !Ref IntakeKmsKey
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: urgdstudios-com

  # TEMPORARILY COMMENTED OUT - Orphaned pending subscriptions blocking creation
  # Will re-enable after 3-day auto-expiration period
  # See: Slice 3 deployment - pending subscription conflict resolution
  
  # AlertsSubscription:
  #   Type: AWS::SNS::Subscription
  #   Properties:
  #     TopicArn: !Ref AlertsTopic
  #     Protocol: email
  #     Endpoint: !Ref AlertsEmail

  # CloudWatch Alarms
  IntakeLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'urgd-urgdstudios-com-intake-errors-${Environment}'
      AlarmDescription: 'Intake Lambda error rate exceeded 10%'
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref IntakeFunction
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  IntakeLambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'urgd-urgdstudios-com-intake-throttles-${Environment}'
      AlarmDescription: 'Intake Lambda throttle detected'
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref IntakeFunction
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  IntakeLambdaLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'urgd-urgdstudios-com-intake-latency-${Environment}'
      AlarmDescription: 'Intake Lambda p99 latency exceeded 3s'
      MetricName: Duration
      Namespace: AWS/Lambda
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref IntakeFunction
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  IntakeDynamoDBThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'urgd-urgdstudios-com-intake-dynamodb-throttles-${Environment}'
      AlarmDescription: 'DynamoDB throttle detected on submissions table'
      MetricName: WriteThrottleEvents
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref IntakeSubmissionsTable
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  # CloudWatch Dashboard
  IntakeDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'urgd-urgdstudios-com-intake-${Environment}'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${IntakeFunction}", {"stat": "Sum", "label": "Invocations"}],
                  [".", "Errors", ".", ".", {"stat": "Sum", "label": "Errors"}],
                  [".", "Throttles", ".", ".", {"stat": "Sum", "label": "Throttles"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Intake Lambda Metrics",
                "period": 300
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${IntakeFunction}", {"stat": "Average", "label": "p50"}],
                  ["...", {"stat": "p99", "label": "p99"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Intake Lambda Duration",
                "period": 300
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${IntakeSubmissionsTable}", {"stat": "Sum"}],
                  [".", "ConsumedWriteCapacityUnits", ".", ".", {"stat": "Sum"}],
                  [".", "WriteThrottleEvents", ".", ".", {"stat": "Sum"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "DynamoDB Metrics",
                "period": 300
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/SNS", "NumberOfMessagesPublished", "TopicName", "${IntakeTopic.TopicName}", {"stat": "Sum"}],
                  [".", "NumberOfNotificationsFailed", ".", ".", {"stat": "Sum"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "SNS Notifications",
                "period": 300
              }
            }
          ]
        }

# ========================================
# Outputs (CI/CD contract)
# ========================================
Outputs:
  CloudFrontDistributionId:
    Description: 'CloudFront distribution ID (used by CI/CD for cache invalidation and WAF association)'
    Value: !Ref SiteDistribution
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDistributionId'

  S3BucketName:
    Description: 'S3 bucket name (used by CI/CD for S3 sync)'
    Value: !Ref SiteBucket
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketName'

  CloudFrontDistributionURL:
    Description: 'CloudFront domain name'
    Value: !GetAtt SiteDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDistributionURL'

  # Slice 3 Outputs
  ApiBaseUrl:
    Description: 'API Gateway base URL (used by CI/CD for smoke tests)'
    Value: !Sub 'https://${IntakeApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiBaseUrl'

  IntakeApiId:
    Description: 'API Gateway ID'
    Value: !Ref IntakeApi
    Export:
      Name: !Sub '${AWS::StackName}-IntakeApiId'
