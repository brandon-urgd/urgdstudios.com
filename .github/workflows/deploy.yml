name: Deploy to S3 + Invalidate CloudFront

on:
  push:
    branches:
      - main   # runs when you push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Sync files to S3
        run: |
          aws s3 sync . s3://urgdstudios.com --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude "*.md" \
            --cache-control "public, max-age=31536000" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id D2SY19WAJQR2EX \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          
          echo "Invalidation created with ID: $INVALIDATION_ID"
          
          # Optional: Wait for invalidation to complete (can take 10-15 minutes)
          # aws cloudfront wait invalidation-completed \
          #   --distribution-id D2SY19WAJQR2EX \
          #   --id $INVALIDATION_ID
          
          echo "Deployment completed successfully!"